<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="application-name" content="go do it" />
		<meta
			name="description"
			content="A small time tracker on top of Todoist. Start a stopwatch on any task, then log the session as a comment and save it as the task's duration."
		/>
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="go do it" />
		<meta property="og:title" content="go do it" />
		<meta property="og:url" content="https://godoit.asbedb.dev/" />
		<meta
			property="og:description"
			content="A small time tracker on top of Todoist. Start a stopwatch on any task, then log the session as a comment and save it as the task's duration."
		/>
		<meta property="og:image" content="https://godoit.asbedb.dev/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="go do it, a Todoist task timer" />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
